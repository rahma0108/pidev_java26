# --- MySQL (développement local typique) ---
spring.datasource.url=jdbc:mysql://localhost:3306/medilink?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
app.demo.patientId=4

# --- Gemini (test) : clé réelle obligatoire, format AIza + ~35 caractères ---
# Création : https://aistudio.google.com/app/apikey
# Ou variable d’environnement GEMINI_API_KEY (prioritaire sur ce fichier).
gemini.api.key=
gemini.model=gemini-2.0-flash-001

# --- Stripe (mode TEST) : clé sk_test_... depuis le tableau de bord Stripe ---
# https://dashboard.stripe.com/test/apikeys
# Ou variable d’environnement STRIPE_SECRET_KEY (prioritaire).
# Carte de test fréquente : 4242 4242 4242 4242, date future, CVC au choix.
stripe.secret.key=
stripe.currency=eur
stripe.checkout.success.url=https://example.com/success
stripe.checkout.cancel.url=https://example.com/cancel
