<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Map Picker</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    html, body, #map {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, sans-serif;
    }
  </style>
</head>
<body>
<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  const tunisiaCenter = [34.0, 9.0];
  const map = L.map("map").setView(tunisiaCenter, 6);

  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19,
    attribution: "&copy; OpenStreetMap contributors"
  }).addTo(map);

  let marker = null;

  function notifyJava(address, lat, lon) {
    if (window.javaBridge && typeof window.javaBridge.onAddressSelected === "function") {
      window.javaBridge.onAddressSelected(address, lat, lon);
    }
    // Fallback robuste pour JavaFX WebView: passe aussi via prompt handler.
    if (typeof window.prompt === "function") {
      const payload = "MAP_PICK|" + lat + "|" + lon + "|" + (address || "");
      window.prompt(payload, "");
    }
  }

  function reverseGeocode(lat, lon) {
    const url = "https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=" + lat + "&lon=" + lon;
    fetch(url, {
      method: "GET",
      headers: { "Accept": "application/json" }
    })
      .then(resp => resp.json())
      .then(data => {
        const address = data && data.display_name ? data.display_name : "";
        notifyJava(address, lat, lon);
      })
      .catch(() => {
        notifyJava("", lat, lon);
      });
  }

  map.on("click", function (e) {
    const lat = e.latlng.lat;
    const lon = e.latlng.lng;

    if (marker) {
      marker.setLatLng([lat, lon]);
    } else {
      marker = L.marker([lat, lon]).addTo(map);
    }

    // Remplit immédiatement le champ côté JavaFX dès le clic.
    notifyJava("", lat, lon);

    // Puis tente d'améliorer avec une adresse lisible.
    reverseGeocode(lat, lon);
  });

  // Called by Java once the bridge is ready.
  window.onJavaReady = function () {
    // No-op: reserved for future behavior.
  };
</script>
</body>
</html>
